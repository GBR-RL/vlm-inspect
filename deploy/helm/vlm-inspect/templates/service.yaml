apiVersion: v1
kind: Service
metadata:
  name: {{ include "vlm-inspect.fullname" . }}
  labels:
    {{- include "vlm-inspect.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP}
  selector:
    {{- include "vlm-inspect.selectorLabels" . | nindent 4 }}
