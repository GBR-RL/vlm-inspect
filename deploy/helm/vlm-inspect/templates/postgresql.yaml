{{- if .Values.postgresql.enabled }}
{{- $fullname := include "vlm-inspect.postgresql.fullname" . }}
{{- $auth := .Values.postgresql.auth }}
{{- $password := $auth.password }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $fullname }}
{{- if and $existing (hasKey ($existing.data | default dict) "postgres-password") }}
{{- $password = index $existing.data "postgres-password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "vlm-inspect.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ $password | b64enc | quote }}
  database-url: {{ printf "postgresql+psycopg://%s:%s@%s:5432/%s" $auth.username $password $fullname $auth.database | b64enc | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "vlm-inspect.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
  selector:
    {{- include "vlm-inspect.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "vlm-inspect.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ $fullname }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "vlm-inspect.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        {{- include "vlm-inspect.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - name: POSTGRES_USER
              value: {{ $auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ $auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}
                  key: postgres-password
            # A subdirectory: volume roots may contain lost+found, which initdb refuses.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
{{- end }}
