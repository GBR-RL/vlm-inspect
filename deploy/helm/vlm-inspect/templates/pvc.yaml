{{- if and .Values.modelCache.enabled (not .Values.modelCache.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vlm-inspect.fullname" . }}-models
  labels:
    {{- include "vlm-inspect.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep  # weights survive uninstall; delete the claim by hand
spec:
  accessModes:
    {{- toYaml .Values.modelCache.accessModes | nindent 4 }}
  {{- with .Values.modelCache.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.modelCache.size }}
{{- end }}
