{{- /* `helm test <release>`: inspects an image end to end from inside the cluster. */ -}}
{{- if has "stub" .Values.inspection.methods }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "vlm-inspect.fullname" . }}-smoke-test
  labels:
    {{- include "vlm-inspect.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: smoke-test
      image: {{ include "vlm-inspect.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - vlm-inspect
        - smoke-test
        - --url
        - http://{{ include "vlm-inspect.fullname" . }}:{{ .Values.service.port }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
{{- end }}
