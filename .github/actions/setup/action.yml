name: Set up vlm-inspect
description: Python, CPU PyTorch, the package with the requested extras, and cached downloads.
inputs:
  extras:
    description: Comma-separated optional dependency groups (vlm, yolo, ...)
    required: true
  model-cache:
    description: Restore/save the Hugging Face model cache
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install
      shell: bash
      run: |
        python -m pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
        python -m pip install --quiet -e ".[${{ inputs.extras }}]"
    # The 1.9 GB VisA archive and the 4 GB model are downloaded once and restored from the cache
    # (free for public repositories, 10 GB per repository).
    - uses: actions/cache@v4
      with:
        path: data/raw
        key: visa-20220922-v1
    - uses: actions/cache@v4
      if: inputs.model-cache == 'true'
      with:
        path: ${{ env.HF_HOME }}
        key: hf-qwen3-vl-2b-instruct-v1
