name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # No torch, transformers or ultralytics here: model code imports them lazily.
      - name: Install
        run: python -m pip install -e ".[dev,api]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest (SQLite)
        run: pytest

  postgres:
    name: API and migrations against PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: vlm
          POSTGRES_PASSWORD: vlm
          POSTGRES_DB: vlm_inspect
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vlm -d vlm_inspect"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      VLM_INSPECT_TEST_DATABASE_URL: postgresql+psycopg://vlm:vlm@localhost:5432/vlm_inspect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,api]"
      - run: pytest tests/test_api.py tests/test_migrations.py

  container:
    name: Docker image + Compose smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack (API + PostgreSQL)
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Inspect an image through the running service
        run: |
          python3 - <<'EOF'
          import json, struct, urllib.request, uuid, zlib

          def png(w, h, value):
              raw = b"".join(b"\x00" + bytes([value]) * (w * 3) for _ in range(h))
              def chunk(tag, data):
                  return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data))
              header = struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", header) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")

          boundary = uuid.uuid4().hex
          body = (f"--{boundary}\r\nContent-Disposition: form-data; name=\"part\"\r\n\r\npcb1\r\n"
                  f"--{boundary}\r\nContent-Disposition: form-data; name=\"file\"; filename=\"x.png\"\r\n"
                  "Content-Type: image/png\r\n\r\n").encode() + png(64, 48, 230) + f"\r\n--{boundary}--\r\n".encode()
          req = urllib.request.Request("http://localhost:8000/inspect", data=body, method="POST",
                                       headers={"Content-Type": f"multipart/form-data; boundary={boundary}"})
          created = json.load(urllib.request.urlopen(req))
          stored = json.load(urllib.request.urlopen(f"http://localhost:8000/inspections/{created['id']}"))
          assert stored["id"] == created["id"] and stored["is_defective"] is True, stored
          health = json.load(urllib.request.urlopen("http://localhost:8000/health"))
          assert health["database"] == "ok", health
          print("stored inspection", created["id"], "- health:", health)
          EOF
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - run: docker compose down --volumes
