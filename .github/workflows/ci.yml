name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # No torch, transformers or ultralytics here: model code imports them lazily.
      - name: Install
        run: python -m pip install -e ".[dev,api]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest (SQLite)
        run: pytest

  postgres:
    name: API and migrations against PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: vlm
          POSTGRES_PASSWORD: vlm
          POSTGRES_DB: vlm_inspect
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vlm -d vlm_inspect"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      VLM_INSPECT_TEST_DATABASE_URL: postgresql+psycopg://vlm:vlm@localhost:5432/vlm_inspect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,api]"
      - run: pytest tests/test_api.py tests/test_migrations.py

  container:
    name: Docker image + Compose smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack (API + PostgreSQL)
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Inspect an image and write its report through the running service
        run: docker compose exec -T api vlm-inspect smoke-test --url http://localhost:8000
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - run: docker compose down --volumes

  kubernetes:
    name: Helm chart on a kind cluster
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint the chart (default and full-model values)
        run: |
          helm lint deploy/helm/vlm-inspect --strict
          helm lint deploy/helm/vlm-inspect --strict -f deploy/helm/vlm-inspect/values-full.yaml
      - uses: helm/kind-action@v1
        with:
          cluster_name: vlm-inspect
      - name: Build the image and load it into the cluster
        run: |
          docker build --target api -t vlm-inspect:ci .
          kind load docker-image vlm-inspect:ci --name vlm-inspect
      - name: Install (API + PostgreSQL with pgvector)
        run: >
          helm install vlm deploy/helm/vlm-inspect --set image.tag=ci --set image.pullPolicy=Never
          --wait --timeout 5m
      - name: helm test - inspection and grounded report from inside the cluster
        run: helm test vlm --logs
      - name: Upgrade to two replicas (concurrent migrations) and test again
        run: |
          helm upgrade vlm deploy/helm/vlm-inspect --reuse-values --set replicaCount=2 --wait --timeout 5m
          helm test vlm --logs
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get all,pvc,secrets -o wide
          kubectl describe pods
          kubectl logs -l app.kubernetes.io/instance=vlm --all-containers --prefix --tail=200
